<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    
   

    
    <nav class="sidenav">
        <div class="logo">
            <img src="logo.svg" alt="Logo">
        </div>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item">Dashboard</a>
            <a href="transactions.html" class="nav-item">Transactions</a>
            <a href="budget.html" class="nav-item active">Budget</a>
            <a href="settings.html" class="nav-item">Settings</a>
            <button class="nav-item logout" id="logout-button">Log Out</button>
        </div>
    </nav>

    <div class="mainContent">
        <div class="budget-categories">
            <div class="categories-header">
                <h2>Budget</h2>
            </div>
            
            <div id="categoriesList">
                <!-- Categories will be populated here -->
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Category</h3>
            <div class="modal-form">
                <div class="form-group">
                    <label for="categoryName">Name</label>
                    <input type="text" id="categoryName" placeholder="Enter category name">
                    <div id="categoryNameError" class="error-message" style="display: none;"></div>
                </div>
                <div class="form-group" id="amountGroup">
                    <label for="categoryAmount">Amount</label>
                    <input type="number" id="categoryAmount" placeholder="0.00">
                </div>
                <div class="modal-buttons">
                    <div id="deleteButtonContainer">
                        <button class="delete-btn" id="deleteButton">Delete</button>
                        <div class="delete-confirmation" id="deleteConfirmation">
                            <span class="delete-confirmation-text">Are you sure?</span>
                            <div class="delete-confirmation-buttons">
                                <button class="cancel-btn" id="deleteCancelBtn">Cancel</button>
                                <button class="delete-yes-btn" id="deleteYesBtn">Yes, Delete</button>
                            </div>
                        </div>
                    </div>
                    <div class="right-buttons">
                        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                        <button class="save-btn" onclick="saveCategory()">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content delete-modal">
            <h3>Delete Category?</h3>
            <p id="deleteWarningText">Are you sure you want to delete this category? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeDeleteModal()">Cancel</button>
                <button class="delete-confirm-btn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>




    <script src="script.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/init.js"></script>
    
    <script src="js/budget.js"></script>
    
</body>
</html>
