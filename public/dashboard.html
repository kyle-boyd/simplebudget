<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
</head>
<body>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    


    <!-- Navigation and content -->
    <nav class="sidenav">
        <div class="logo">
            <img src="logo.svg" alt="Logo">
        </div>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item active">Dashboard</a>
            <a href="transactions.html" class="nav-item">Transactions</a>
            <a href="budget.html" class="nav-item">Budget</a>
            <a href="settings.html" class="nav-item">Settings</a>
            <button class="nav-item logout" id="logout-button">Log Out</button>
        </div>
    </nav>

    <div class="mainContent">
        <div class="top-controls">
            <div class="month-selector">
                <div class="custom-select">
                    <div class="select-selected" id="selectedMonth">All Months</div>
                    <div class="select-items" id="monthOptions">
                        <!-- Options will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
        <div class="dashboard-grid">
            <div class="chart-card">
                <h3>Monthly Spending by Main Category</h3>
                <div class="chart-container">
                    <canvas id="mainSpending"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>Spending Trends</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>Budget vs Actual</h3>
                <div class="chart-container">
                    <canvas id="yearlyBudgetChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <h3>Top Spending Categories</h3>
                <div class="chart-container">
                    <canvas id="overBudgetChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Load Chart.js first -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Then load your application scripts -->
    <script src="js/dashboard.js"></script>
    <script src="js/init.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
